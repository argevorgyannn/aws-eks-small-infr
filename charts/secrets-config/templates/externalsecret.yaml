apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: {{ .Values.secretName }}
  # Every key of the JSON secret becomes a key of the Kubernetes Secret
  dataFrom:
    - extract:
        key: {{ .Values.remoteKey }}
