# Runs the k6 script inside the cluster, against the demo-app Service.
# The script itself comes from a ConfigMap:
#   kubectl create configmap k6-script --from-file=loadtest/script.js -n demo
apiVersion: batch/v1
kind: Job
metadata:
  name: k6
  namespace: demo
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:2.3.0
          args: ["run", "/scripts/script.js"]
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: k6-script
